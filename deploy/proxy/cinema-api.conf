# nginx on proxy (#34): TLS for cinema-api.strycks.dpdns.org, passed to app.
# Goes to /etc/nginx/sites-available/cinema-api and is linked from
# sites-enabled/ (docs/infra/runbook.md). Port 443 only: sg-proxy blocks 80,
# and the certificate comes through DNS-01.

# Any other name, or none, gets its TLS handshake refused: the wildcard
# certificate only serves the names listed below.
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cinema-api.strycks.dpdns.org;

    # Wildcard *.strycks.dpdns.org, renewed by certbot.timer.
    ssl_certificate     /etc/letsencrypt/live/strycks.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/strycks.dpdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    # No HSTS yet: browsers can't forget it, and the other subdomains under
    # the wildcard aren't settled.

    location / {
        # app comes from /etc/hosts.
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # Every client shows up as 10.10.30.1 (the router's tailnet SNAT), so
        # this is logged, not trusted.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
