# PostgreSQL on the db VM (#34). Copied to /home/debian/cinema/ with .env next
# to it (cp .env.example .env); see docs/infra/runbook.md.
services:
  db:
    # Fixed for the life of pgdata: alpine and debian images sort text
    # differently, so switching would corrupt indexes.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      # Only applied when the data directory is first created.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${DB_BIND_IP:?set DB_BIND_IP in .env}:5432:5432"
    volumes:
      # A subdirectory of the pgdata mount: its root holds lost+found, which
      # initdb refuses. If the volume isn't mounted, the directory is missing
      # and the container fails instead of starting an empty database on the
      # root disk.
      - type: bind
        source: /srv/pgdata/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      retries: 10
    restart: unless-stopped
