# The backend on the app VM (#34). Copied to /home/debian/cinema/ with .env next
# to it (cp .env.example .env); see docs/infra/runbook.md.
services:
  app:
    # A full commit sha, never latest: .env records what runs.
    image: ghcr.io/14m6d4/se-phase-01:${IMAGE_TAG:?set IMAGE_TAG in .env}
    environment:
      DB_URL: jdbc:postgresql://db:5432/cinema
      DB_USERNAME: cinema
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cinema.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # nginx terminates TLS: X-Forwarded-Proto makes Swagger UI use https.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    # A container doesn't read the VM's /etc/hosts.
    extra_hosts:
      - "db:${DB_HOST_IP:?set DB_HOST_IP in .env}"
    ports:
      - "${APP_BIND_IP:?set APP_BIND_IP in .env}:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
