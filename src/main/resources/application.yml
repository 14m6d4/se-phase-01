spring:
  application:
    name: cinema
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD:cinema}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
