spring:
  application:
    name: cinema
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

# Only non-secret values have defaults. DB_PASSWORD, ADMIN_PASSWORD and JWT_SECRET must be set:
# without the last two the app refuses to start, without DB_PASSWORD it fails to connect to the database.
# docker-compose.yml (via .env) and the tests supply them.
app:
  admin:
    email: ${ADMIN_EMAIL:admin@cinema.local}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
