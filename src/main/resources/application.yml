spring:
  application:
    name: cinema
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:40}
      minimum-idle: ${HIKARI_MIN_IDLE:40}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 20
      hibernate.order_inserts: true
      hibernate.order_updates: true
  mvc:
    problemdetails:
      enabled: true
  # No endpoint accepts uploads. Left on, the multipart resolver parses any multipart/* request before a controller
  # runs and a missing boundary surfaces as a 500 (B5).
  servlet:
    multipart:
      enabled: false

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:40}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    max-keep-alive-requests: -1

# Only non-secret values have defaults. DB_PASSWORD, ADMIN_PASSWORD and JWT_SECRET must be set:
# without the last two the app refuses to start, without DB_PASSWORD it fails to connect to the database.
# docker-compose.yml (via .env) and the tests supply them.
app:
  admin:
    email: ${ADMIN_EMAIL:admin@cinema.local}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    decoder-cache-max-entries: ${JWT_DECODER_CACHE_MAX_ENTRIES:4096}
    decoder-cache-ttl: ${JWT_DECODER_CACHE_TTL:15m}
  seat-inventory:
    strategy: ${SEAT_INVENTORY_STRATEGY:unique}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:20000}
    bucket-ttl-seconds: ${RATE_LIMIT_BUCKET_TTL_SECONDS:600}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:60}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:60}
      refill-duration-seconds: ${RATE_LIMIT_AUTH_DURATION:60}
    login:
      account:
        capacity: ${RATE_LIMIT_LOGIN_ACCOUNT_CAPACITY:5}
        refill-tokens: ${RATE_LIMIT_LOGIN_ACCOUNT_REFILL_TOKENS:5}
        refill-duration-seconds: ${RATE_LIMIT_LOGIN_ACCOUNT_DURATION:60}
    api:
      capacity: ${RATE_LIMIT_API_CAPACITY:3000}
      refill-tokens: ${RATE_LIMIT_API_REFILL_TOKENS:3000}
      refill-duration-seconds: ${RATE_LIMIT_API_DURATION:60}
  anti-hoarding:
    enabled: ${ANTI_HOARDING_ENABLED:true}
    abandon-cooldown-seconds: ${ANTI_HOARDING_ABANDON_COOLDOWN_SECONDS:5}
    max-abandons-in-window: ${ANTI_HOARDING_MAX_ABANDONS_IN_WINDOW:3}
    repeated-abandon-penalty-seconds: ${ANTI_HOARDING_REPEATED_ABANDON_PENALTY_SECONDS:120}
    max-active-holds-per-ip: ${ANTI_HOARDING_MAX_ACTIVE_HOLDS_PER_IP:3}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:logstash}
  level:
    vn.edu.uet.cinema.config.TraceResponseHeaderFilter: ${HTTP_ACCESS_LOG_LEVEL:INFO}
    org.hibernate.orm.jdbc.error: ${HIBERNATE_JDBC_ERROR_LEVEL:ERROR}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
