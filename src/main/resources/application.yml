spring:
  application:
    name: cinema
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:40}
      minimum-idle: ${HIKARI_MIN_IDLE:40}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 20
      hibernate.order_inserts: true
      hibernate.order_updates: true
  mvc:
    problemdetails:
      enabled: true
  # No endpoint accepts uploads. Left on, the multipart resolver parses any multipart/* request before a controller
  # runs and a missing boundary surfaces as a 500 (B5).
  servlet:
    multipart:
      enabled: false

server:
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:40}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:40}
    accept-count: ${TOMCAT_ACCEPT_COUNT:2000}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    max-keep-alive-requests: -1

# Only non-secret values have defaults. DB_PASSWORD, ADMIN_PASSWORD and JWT_SECRET must be set:
# without the last two the app refuses to start, without DB_PASSWORD it fails to connect to the database.
# docker-compose.yml (via .env) and the tests supply them.
app:
  admin:
    email: ${ADMIN_EMAIL:admin@cinema.local}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
  seat-inventory:
    strategy: ${SEAT_INVENTORY_STRATEGY:unique}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth:
      capacity: ${RATE_LIMIT_AUTH_CAPACITY:200}
      refill-tokens: ${RATE_LIMIT_AUTH_REFILL_TOKENS:200}
      refill-duration-seconds: ${RATE_LIMIT_AUTH_DURATION:60}
    api:
      capacity: ${RATE_LIMIT_API_CAPACITY:3000}
      refill-tokens: ${RATE_LIMIT_API_REFILL_TOKENS:3000}
      refill-duration-seconds: ${RATE_LIMIT_API_DURATION:60}
  anti-hoarding:
    enabled: ${ANTI_HOARDING_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
