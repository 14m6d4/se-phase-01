# Makes a local stack resemble the Kaggle load-test machine (ADR 0003), so a local result predicts the Kaggle one:
# the service and PostgreSQL share three CPUs, and PostgreSQL is 14 as installed by apt on Kaggle.
# Keep the load generator off these CPUs (see loadtest/locust/README.md).
#
#   docker compose -f docker-compose.yml -f loadtest/locust/compose.kaggle-like.yml up -d --build
services:
  db:
    image: postgres:14-alpine
    cpuset: "${APP_CPUS:-1-3}"
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    volumes:
      - pgdata14:/var/lib/postgresql/data
  app:
    # Pick the build to measure: APP_IMAGE=se-phase-01:<label> docker compose ... up -d --no-build app
    image: "${APP_IMAGE:-ghcr.io/14m6d4/se-phase-01:latest}"
    cpuset: "${APP_CPUS:-1-3}"
    environment:
      # Experiment knob: Hibernate logs every unique violation (a lost seat race, ADR 0004) at WARN.
      LOGGING_LEVEL_ORG_HIBERNATE_ORM_JDBC_ERROR: "${HIBERNATE_JDBC_ERROR_LEVEL:-WARN}"
      SEAT_INVENTORY_STRATEGY: "${SEAT_INVENTORY_STRATEGY:-unique}"
    # Own port, so the stack can run beside anything else on 8080. Locust then needs BASE_URL.
    ports: !override
      - "127.0.0.1:${APP_PORT:-18080}:8080"

volumes:
  pgdata14:
