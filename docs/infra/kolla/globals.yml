# Kolla-Ansible globals for the DL380 G9 all-in-one (docs/infra/openstack.md).
# Copy to /etc/kolla/globals.yml. Everything not set here keeps the Kolla
# default. Secrets live in /etc/kolla/passwords.yml, never in this repo.
# verify-openstack.sh compares the live file with this one, comments ignored.
---
workaround_ansible_issue_8743: true
kolla_base_distro: "ubuntu"
kolla_internal_vip_address: "10.10.20.12"
kolla_internal_fqdn: "openstack.strycks.dpdns.org"
kolla_external_fqdn: "openstack.strycks.dpdns.org"
network_interface: "eno2"
neutron_external_interface: "eno3"
kolla_externally_managed_cert: false
kolla_enable_tls_internal: true
database_enable_tls_backend: "{{ 'true' if kolla_enable_tls_backend | bool and enable_proxysql | bool else 'false' }}"
database_enable_tls_internal: false
kolla_enable_tls_backend: false
enable_cinder: true
enable_cinder_backup: false
enable_cinder_backend_lvm: true
